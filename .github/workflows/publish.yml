name: Publish to npm

on:
  push:
    tags:
      # 兼容 v0.2.0（npm version 默认 v 前缀）与 0.2.0（无前缀 tag）
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: read
  # GitHub OIDC：npm Trusted Publishers 认证 + provenance 签名均依赖它
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # 指向 npmjs registry；认证经 npm Trusted Publishers 的 GitHub OIDC
          # 自动完成（npm CLI 探测到 OIDC 环境即优先使用，无需长期 token）
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 包内 prepublishOnly 已含 typecheck + test + build（npm publish 前强制跑）；
      # 这里显式先跑一遍，让门禁失败在「发布」步骤之前就清晰可见
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (dist)
        run: npm run build

      # Trusted Publishers：npm CLI 用 GitHub OIDC 认证 publish，
      # provenance attestation 默认自动生成（无需 --provenance flag）。
      # 前置（npmjs.com 包设置页 Trusted Publisher）：workflow 填 publish.yml、
      # organization 填 liankong233、repository 填 a2aw-ts、actions 勾 npm publish；
      # package.json 的 repository.url 已与 GitHub 仓库匹配（https://github.com/liankong233/a2aw-ts.git）
      - name: Publish to npm
        run: npm publish